<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نظام إدارة خدمة أسرة تلاميذ المسيح">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="إدارة الخدمة">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/app-icon.svg">
  <link rel="apple-touch-icon" href="icons/app-icon.svg">
  <title>أسرة تلاميذ المسيح</title>
</head>
<body>
  <script>
    (() => {
      let deferredInstallPrompt;
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
      });

      window.canPromptToInstall = () => deferredInstallPrompt != null;
      window.isRunningAsInstalledApp = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        navigator.standalone === true;
      window.promptToInstall = async () => {
        if (!deferredInstallPrompt) return false;
        const event = deferredInstallPrompt;
        deferredInstallPrompt = null;
        await event.prompt();
        const choice = await event.userChoice;
        return choice.outcome === 'accepted';
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
