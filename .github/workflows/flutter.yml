name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - name: Prepare Drift Web assets
        shell: bash
        run: |
          mkdir -p web
          curl -fsSL https://github.com/simolus3/drift/releases/download/drift-2.35.1/sqlite3.wasm -o web/sqlite3.wasm
          curl -fsSL https://github.com/simolus3/drift/releases/download/drift-2.35.1/drift_worker.js -o web/drift_worker.js
      - run: flutter build web
      - name: Run Flutter tests
        run: flutter test --reporter expanded --timeout 60s
      - name: Generate login goldens
        run: flutter test --reporter expanded --timeout 60s --update-goldens test/login_page_golden_test.dart
      - name: Generate sync center goldens
        if: always()
        run: flutter test --reporter expanded --timeout 60s --update-goldens test/sync_center_widget_test.dart
      - name: Generate Task 6 mobile light/dark goldens
        if: always()
        run: flutter test --reporter expanded --timeout 60s --update-goldens test/task6_mobile_golden_test.dart
      - name: Upload golden baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-5-and-6-goldens
          path: test/goldens/
          if-no-files-found: warn
